meta:
  title: 'Cuộc Đời Đức Phật Thích Ca — Biên Niên Sử Hoạt Hình Truyền Thuyết (ANM Phật Pháp)'
  description: 'Trọn bộ phim hoạt hình lịch sử Cuộc Đời Đức Phật Thích Ca từ kênh ANM Phật Pháp: tái hiện theo dòng thời gian từ tiền thân phát nguyện, Đản sanh tại Lâm-tỳ-ni, bốn cảnh tượng cửa thành, vượt thành xuất gia đến sứ mệnh hoằng pháp sơ kỳ.'
  heroimage: 'https://i.ytimg.com/vi/OxwOCFo3bOM/maxresdefault.jpg'
  heroimagealt: 'Phim Hoạt Hình Lịch Sử Cuộc Đời Đức Phật Thích Ca — ANM Phật Pháp'
  owner: 'quannd'
  author: 'ANM Phật Pháp (@anmphatphap) • Biên tập: Tịnh Độ Liên Hoa'
  created: '2026-11-28'
